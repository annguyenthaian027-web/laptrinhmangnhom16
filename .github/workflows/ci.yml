name: CI

# Định nghĩa thời điểm kích hoạt luồng kiểm tra tự động
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bước 1: Kiểm tra định dạng file YAML
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run pip install yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" docker-compose.yml

      - name: shellcheck
        run: shellcheck install.sh

  # Bước 2: Kiểm tra cấu hình Docker Compose và build thử nghiệm
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Kiem tra cu phap compose (tat ca profile)
        run: |
          cp .env.example .env
          docker compose --profile app --profile vpn config -q

      - name: Build backend/frontend neu co Dockerfile
        run: |
          if [ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ]; then
            docker compose --profile app build
          else
            echo "Chua du Dockerfile cua backend/frontend, bo qua build."
          fi

  # Bước 3: Chạy thật Pi-hole + Unbound và thử phân giải DNS
  test-compose:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Tao .env
        run: cp .env.example .env

      - name: Khoi dong Pi-hole + Unbound
        run: docker compose up -d

      - name: Cho Pi-hole san sang
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost/admin/ > /dev/null; then
              echo "Pi-hole da san sang"
              exit 0
            fi
            sleep 5
          done
          echo "Pi-hole khong khoi dong duoc"
          docker compose logs
          exit 1

      - name: Thu phan giai DNS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          dig @127.0.0.1 -p 5353 example.com +short

      - name: Mo trang web Pi-hole
        run: curl -fsI http://localhost/admin/

      - name: Don dep
        if: always()
        run: docker compose down -v
